<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Filter Platform</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>CSV Filter Platform</h1>
            <p>Upload, Filter, Search and Download CSV Files</p>
        </header>

        <!-- Upload Section -->
        <section class="upload-section">

            <input type="file" id="csvFile" hidden>

            <div class="upload-box" onclick="triggerFileInput()">
                <h2>Upload CSV File</h2>
                <p>Click to browse CSV file</p>
            </div>

            <button id="uploadBtn">
                Upload CSV
            </button>

        </section>

        <!-- File Info -->
        <section class="info-section">

            <div class="info-card">
                <h3>Filename</h3>
                <p id="filename">-</p>
            </div>

            <div class="info-card">
                <h3>Total Rows</h3>
                <p id="totalRows">0</p>
            </div>

        </section>

        <!-- Columns -->
        <section class="columns-section">

            <h2>Columns</h2>

            <div id="columnsContainer">
            </div>
            <button id="applyColumnsBtn">
                Preview Selected Columns
            </button>

        </section>
<!-- Filter Section -->
<section class="filter-section">

    <h2>Filter Data</h2>

    <div id="filtersContainer">

        <div class="filter-controls">

            <select class="columnSelect">
                <option value="">Select Column</option>
            </select>

            <select class="operatorSelect">
                <option value="==">Equals</option>
                <option value="!=">Not Equals</option>
                <option value=">">Greater Than</option>
                <option value="<">Less Than</option>
                <option value="contains">Contains</option>
            </select>

            <input
                type="text"
                class="filterValue"
                placeholder="Enter value"
            >

        </div>

    </div>

    <div class="filter-buttons">

        <button id="addFilterBtn">
            Add Filter
        </button>

        <button id="applyFilterBtn">
            Apply Filters
        </button>

    </div>

</section>

<!-- Sorting -->
<section class="filter-section">

    <h2>Sort Data</h2>

    <div class="filter-controls">

        <select id="sortColumn">
            <option value="">Select Column</option>
        </select>

        <select id="sortOrder">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
        </select>

        <button id="sortBtn">
            Sort
        </button>

    </div>

</section>

<!-- Download -->
<section class="download-section">

    <button id="downloadBtn">
        Download Filtered CSV
    </button>

</section>
        <!-- Search -->
        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search table..."
            >

        </section>

        <!-- Table -->
        <section class="table-section">

            <h2>Preview Data</h2>

            <div class="table-container">

                <table id="dataTable">

                </table>

            </div>

        </section>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
